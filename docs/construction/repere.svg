<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-labelledby="t d"><title id="t">Comment mesurer une demi-aile</title><desc id="d">Sur un schéma de dessus, la cassure est à 208 pixels du milieu. Les deux bouts sont à 943 pixels l’un de l’autre.</desc><rect width="800" height="290" rx="10" fill="#faf7ed"/><g font-family="sans-serif" fill="#193848"><text x="26" y="35" font-size="21">Vue de dessus · Où poser les deux bouts de la règle ?</text><path d="M50 123 L241 102 L559 102 L750 123 L750 155 L559 164 L241 164 L50 155Z" fill="#f3bf4a" stroke="#624d20" stroke-width="2"/><path d="M400 74V196 M559 78V168" stroke="#216c71" stroke-dasharray="5 4"/><path d="M400 82H559 M50 212H750 M50 206v12 M750 206v12" fill="none" stroke="#21575d" stroke-width="2"/><text x="427" y="74">208 px</text><text x="371" y="190">axe</text><text x="568" y="96">cassure</text><text x="332" y="235">943 px = 15,5448 m</text><text x="25" y="272" font-size="15">Schéma pédagogique original. Fais les pointages sur le trois-vues, pas sur ce schéma.</text></g></svg>
