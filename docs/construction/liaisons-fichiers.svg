<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><rect width="1000" height="400" fill="#f4f7fa"/><g font-family="sans-serif" font-size="23" fill="#193348"><text x="30" y="40">Le fichier set relie les éléments de l’appareil</text><rect x="30" y="150" width="280" height="80" rx="10" fill="#ffda72"/><text x="50" y="198">sw233-set.xml</text><g stroke="#46677c" stroke-width="3" fill="none"><path d="M310 190 H390 V95 H440 M390 190 H440 M390 190 V285 H440"/></g><text x="450" y="102">sw233.xml → calcul du vol</text><text x="450" y="197">Models/sw233-model.xml → sw233.ac</text><text x="450" y="292">Checklists/sw233.xml → listes</text><text x="30" y="365" font-size="19">Les animations relient ensuite les pièces nommées aux propriétés du simulateur.</text></g></svg>
