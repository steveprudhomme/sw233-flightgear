<g font-family="sans-serif" font-size="20" fill="#152b42"><text x="200" y="440">x : distance projetée depuis le nez, sans le Pitot</text><text x="40" y="510">À chaque point : x, hauteur z, unité, marge de lecture, photo.</text><text x="40" y="550">Le trait B–C sert au relevé ; il ne prouve pas un cadre réel.</text><text x="40" y="590">Relever les deux côtés. Ne pas supposer leur symétrie.</text><text x="40" y="630">Section S : indiquer sa position x avant de relever W.</text></g>
